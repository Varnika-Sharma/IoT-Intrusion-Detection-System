<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT IDS — {% block title %}Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- ══ SIDEBAR ══════════════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">⬡</span>
    <div class="brand-text">
      <span class="brand-name">IoT IDS</span>
      <span class="brand-sub">Intrusion Detection</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/" class="nav-item {% if page == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">◈</span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="/devices" class="nav-item {% if page == 'devices' %}active{% endif %}">
      <span class="nav-icon">◉</span>
      <span class="nav-label">Devices</span>
    </a>
    <a href="/alerts" class="nav-item {% if page == 'alerts' %}active{% endif %}">
      <span class="nav-icon">⚠</span>
      <span class="nav-label">Alerts</span>
      <span class="nav-badge" id="alert-badge">…</span>
    </a>
    <a href="/logs" class="nav-item {% if page == 'logs' %}active{% endif %}">
      <span class="nav-icon">≡</span>
      <span class="nav-label">Logs</span>
    </a>
    <a href="/reports" class="nav-item {% if page == 'reports' %}active{% endif %}">
      <span class="nav-icon">▦</span>
      <span class="nav-label">Reports</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="system-status-pill" id="system-status-pill">
      <span class="status-dot"></span>
      <span class="status-text">Loading…</span>
    </div>
    <div class="sidebar-meta">B.Tech CS • Minor Project</div>
  </div>
</aside>

<!-- ══ TOPBAR ═════════════════════════════════════════════════════════════── -->
<div class="topbar">
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
  <div class="topbar-left">
    <span class="topbar-title">{% block topbar_title %}Dashboard{% endblock %}</span>
    <span class="topbar-path">IoT IDS / {% block breadcrumb %}Home{% endblock %}</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-time" id="topbar-time"></span>
    <div class="topbar-user">
      <span class="user-avatar">A</span>
      <span class="user-name">Admin</span>
    </div>
  </div>
</div>

<!-- ══ MAIN CONTENT ════════════════════════════════════════════════════════ -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ══ TOAST NOTIFICATION ═════════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<!-- ══ GLOBAL JS ══════════════════════════════════════════════════════════ -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
